name: COBOL to Python Conversion (feature test)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Claude Code
        uses: anthropic/claude-code@v1
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          instructions: |
            Read src/hello.cob.
            Convert COBOL logic to Python.
            Create src/hello.py with equivalent Python code.
            Commit and push the new python file to the current branch.
